    "bcrypt>=4.3.0",
    "fastapi>=0.123.0",
    "logging>=0.4.9.6",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.11",
    "psycopg[binary]>=3.3.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0.44",
    "uvicorn>=0.38.0",
]
