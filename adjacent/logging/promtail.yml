server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Only scrape containers with the label logging=promtail
      - source_labels: ["__meta_docker_container_label_logging"]
        regex: "promtail"
        action: keep
      # Use the container name as a label
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
    pipeline_stages:
      # Parse JSON logs and extract fields as labels
      - json:
          expressions:
            level: level
            logger: logger
            request_id: request_id
            action: action
            user_id: user_id
      - labels:
          level:
          logger:
          request_id:
          action:
          user_id:
